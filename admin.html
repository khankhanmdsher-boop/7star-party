<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Executive Control Panel</title>
    <style>
        body { background-color: #0d0f12; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
        h1 { color: #ffd700; font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        h2 { color: #ffd700; font-size: 16px; margin-top: 0; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0 15px; border-radius: 5px; border: 1px solid #30363d; background: #0d0f12; color: #fff; box-sizing: border-box; }
        button { background: #ffd700; color: #000; font-weight: bold; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #30363d; padding: 8px; text-align: left; font-size: 13px; }
        th { color: #ffd700; }
    </style>
</head>
<body>

    <h1>👑 7 Star Executive Control Panel</h1>

    <!-- Coins Management -->
    <div class="card">
        <h2>💰 Coins Control (कॉइन्स मैनेजमेंट)</h2>
        <input type="text" id="coinUserId" placeholder="User ID लिखें">
        <input type="number" id="coinAmount" placeholder="कॉइन्स की संख्या">
        <button onclick="alert('Coins Updated Successfully!')">Coins Add / Deduct करें</button>
    </div>

    <!-- User Action -->
    <div class="card">
        <h2>🚫 User Management (बैन / किक)</h2>
        <input type="text" id="targetUserId" placeholder="User ID लिखें">
        <select>
            <option>Mute User (आवाज़ बंद करें)</option>
            <option>Ban User (ब्लॉक करें)</option>
            <option>Kick from Room (रूम से बाहर करें)</option>
        </select>
        <button style="background: #ff4d4d; color: #fff;" onclick="alert('Action Applied!')">Apply Action</button>
    </div>

    <!-- Role & Access Table -->
    <div class="card">
        <h2>👥 Role & Access Management</h2>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <tr>
                    <td>1001</td>
                    <td>Admin User</td>
                    <td>Owner</td>
                    <td>Active</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
