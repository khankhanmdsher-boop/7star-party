<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Party & Voice Room</title>
    <style>
        body { background: #0f1020; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1a1b35; padding: 20px; border-radius: 12px; border: 2px solid #f39c12; }
        .wallet { font-size: 18px; margin-bottom: 15px; color: #f1c40f; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .seat { background: #2c3e50; border: 2px dashed #f39c12; border-radius: 50%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #bdc3c7; cursor: pointer; position: relative; }
        .seat.active { background: #27ae60; border-style: solid; color: #fff; }
        .controls { display: flex; gap: 10px; justify-content: center; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-speak { background: #27ae60; color: #fff; }
        .btn-leave { background: #c0392b; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👑 7 Star Voice Party</h2>
        <div class="wallet">Coins: <span id="coins">5000000</span></div>
        
        <h3>Voice Seats (Users Talking)</h3>
        <div class="grid" id="seatGrid">
            <div class="seat active">Seat 1</div>
            <div class="seat">Seat 2</div>
            <div class="seat">Seat 3</div>
            <div class="seat">Seat 4</div>
            <div class="seat">Seat  5</div>
            <div class="seat">Seat 6</div>
            <div class="seat">Seat 7</div>
            <div class="seat">Seat 8</div>
        </div>

        <div class="controls">
            <button class="btn-speak" onclick="toggleMic()">Take Mic</button>
            <button class="btn-leave" onclick="leaveMic()">Leave Seat</button>
        </div>
    </div>

    <script>
        function toggleMic() {
            alert("Voice mic connected!");
        }
        function leaveMic() {
            alert("Left the voice seat.");
        }
    </script>
</body>
</html>
