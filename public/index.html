<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>7 Star Party VIP</title>
    <style>
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: #ffd700; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px;
        }
        .header { font-size: 24px; font-weight: bold; text-shadow: 2px 2px 10px #ff0000; margin-bottom: 15px; }
        .mic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 10px; }
        .mic { 
            background: #1a1a2e; border: 2px solid #ffd700; border-radius: 50%; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center; margin: auto; font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .chat-box { background: rgba(0,0,0,0.5); height: 200px; border-radius: 10px; margin: 15px 0; border: 1px solid #444; }
        .controls { display: flex; gap: 10px; padding: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
        .btn-send { background: #ffd700; color: #000; }
        .btn-gift { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>
    <div class="header">⭐ 7 Star Party Room ⭐</div>
    <div class="mic-grid">
        <div class="mic">M1</div><div class="mic">M2</div><div class="mic">M3</div><div class="mic">M4</div>
        <div class="mic">M5</div><div class="mic">M6</div><div class="mic">M7</div><div class="mic">M8</div>
    </div>
    <div class="chat-box" id="chat"></div>
    <div class="controls">
        <input type="text" placeholder="Message...">
        <button class="btn-send">Send</button>
        <button class="btn-gift">Gift</button>
    </div>
</body>
</html>
