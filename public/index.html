<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Party Room</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0d0f12; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #161b22; border-radius: 8px; margin-bottom: 15px; }
        .coins { color: #ffd700; font-weight: bold; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 360px; margin: 15px auto; }
        .seat { background: #1f242d; border: 2px dashed #30363d; border-radius: 50%; width: 68px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; margin: auto; cursor: pointer; color: #8b949e; }
        .seat.taken { border: 2px solid #00ff88; background: #0e2a1f; color: #00ff88; font-weight: bold; box-shadow: 0 0 8px #00ff88; }
        .chat-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; height: 190px; max-width: 360px; margin: 15px auto; overflow-y: auto; text-align: left; padding: 10px; font-size: 13px; }
        .chat-msg { margin-bottom: 6px; word-wrap: break-word; }
        .input-area { display: flex; gap: 8px; max-width: 360px; margin: auto; }
        input { flex: 1; padding: 12px; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 6px; outline: none; }
        button { padding: 12px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-send { background: #ffd700; color: #000; }
        .btn-gift { background: #ff4d4d; color: #fff; }
        .btn-mic { background: #238636; color: #fff; width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight:bold; color:#ffd700;">👑 7 Star Party</span>
        <span class="coins">💰 Coins: <span id="coinCount">1000</span></span>
    </div>

    <!-- 8 Voice Seats -->
    <div class="grid" id="seatGrid">
        <div class="seat" onclick="takeSeat(1)"><span id="s1">Mic 1</span></div>
        <div class="seat" onclick="takeSeat(2)"><span id="s2">Mic 2</span></div>
        <div class="seat" onclick="takeSeat(3)"><span id="s3">Mic 3</span></div>
        <div class="seat" onclick="takeSeat(4)"><span id="s4">Mic 4</span></div>
        <div class="seat" onclick="takeSeat(5)"><span id="s5">Mic 5</span></div>
        <div class="seat" onclick="takeSeat(6)"><span id="s6">Mic 6</span></div>
        <div class="seat" onclick="takeSeat(7)"><span id="s7">Mic 7</span></div>
        <div class="seat" onclick="takeSeat(8)"><span id="s8">Mic 8</span></div>
    </div>

    <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎙️ Mic Mute/Unmute</button>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
        <div class="chat-msg" style="color: #ffd700;"><b>System:</b> Welcome to 7 Star Voice & Chat Engine!</div>
    </div>

    <!-- Inputs -->
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type message...">
        <button class="btn-send" onclick="sendMsg()">Send</button>
        <button class="btn-gift" onclick="sendGift()">🎁 Gift</button>
    </div>

    <script>
        const socket = io();
        let mySeat = null;
        let localStream;
        let micOn = true;
        let coins = 1000;

        // Voice Access
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            localStream = stream;
        }).catch(() => {});

        function takeSeat(num) {
            if(mySeat) return;
            mySeat = num;
            socket.emit('seat-take', { seat: num, user: 'User_' + socket.id.substring(0,4) });
        }

        function toggleMic() {
            if (!localStream) return;
            micOn = !micOn;
            localStream.getAudioTracks()[0].enabled = micOn;
            document.getElementById('micBtn').style.background = micOn ? '#238636' : '#da3633';
            document.getElementById('micBtn').innerText = micOn ? '🎙️ Mic ON' : '🎙️ Mic OFF';
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            socket.emit('chat-msg', { user: 'User_' + socket.id.substring(0,4), text: input.value });
            addChat('You', input.value);
            input.value = '';
        }

        function sendGift() {
            if(coins < 50) return alert('Not enough coins!');
            coins -= 50;
            document.getElementById('coinCount').innerText = coins;
            socket.emit('chat-msg', { user: 'User_' + socket.id.substring(0,4), text: '🎁 Sent a Rose Gift (50 Coins)!' });
            addChat('Gift', '🎁 You sent a Rose Gift!');
        }

        function addChat(sender, text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b>${sender}:</b> ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat-msg', (data) => addChat(data.user, data.text));
        socket.on('seat-update', (data) => {
            const el = document.getElementById('s' + data.seat);
            if(el) {
                el.parentElement.classList.add('taken');
                el.innerText = data.user;
            }
        });
    </script>
</body>
</html>
