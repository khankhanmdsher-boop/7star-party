<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Party Room - Final</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
        body { background: var(--bg-grad); color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 400px; margin: 0 auto; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 20px; border: 1px solid #ffd700; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .seat { background: rgba(255,255,255,0.1); border-radius: 15px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; position: relative; border: 2px solid transparent; }
        .seat.taken { border: 2px solid #00ff88; }
        .seat.frame-gold { border: 3px solid #ffd700; box-shadow: 0 0 10px #ffd700; }
        .medal-badge { position: absolute; top: -5px; right: -5px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>👑 7 Star Party Room</h3>
        <div class="grid" id="seatGrid">
            <!-- Seats will be rendered dynamically -->
        </div>
        <div id="chatBox" style="height:100px; overflow:auto; background:rgba(0,0,0,0.3); padding:5px; font-size:12px;"></div>
    </div>

    <script>
        const socket = io();
        const grid = document.getElementById('seatGrid');
        
        // Render empty seats initially
        for(let i=1; i<=8; i++) {
            grid.innerHTML += `<div class="seat" id="seat${i}"><span class="medal-badge" id="m${i}"></span><div style="font-size:20px">🪑</div><span id="s${i}">Seat ${i}</span></div>`;
        }

        socket.on('init-state', (state) => {
            Object.keys(state.seats).forEach(seatNum => {
                updateSeatUI(state.seats[seatNum]);
            });
        });

        socket.on('seat-update', updateSeatUI);
        socket.on('seat-remove', (data) => {
            const el = document.getElementById('seat'+data.seat);
            el.className = 'seat';
            el.querySelector('.medal-badge').innerText = '';
            document.getElementById('s'+data.seat).innerText = 'Seat '+data.seat;
        });

        socket.on('ceo-perm-applied', (data) => {
            const el = document.getElementById('seat'+data.seat);
            if(data.frame !== 'none') el.className = 'seat taken ' + data.frame;
            if(data.medal !== 'none') el.querySelector('.medal-badge').innerText = data.medal;
        });

        function updateSeatUI(data) {
            const el = document.getElementById('seat'+data.seat);
            el.classList.add('taken');
            document.getElementById('s'+data.seat).innerText = data.user;
        }
    </script>
</body>
</html>
