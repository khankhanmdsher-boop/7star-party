<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Voice Party Room</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0b0e14; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ffd700; font-size: 20px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 30px auto; max-width: 400px; }
        .seat { background: #1a202c; border: 2px dashed #4a5568; border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 12px; margin: auto; }
        .active { border: 2px solid #00ff88; box-shadow: 0 0 10px #00ff88; }
        .controls { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; }
        button { padding: 12px 24px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; }
        .btn-mic { background: #00ff88; color: #000; }
        .btn-leave { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>

    <h1>🎙️ 7 Star Voice Party Room</h1>
    <p style="color: #a0aec0; font-size: 14px;">Status: <span id="status" style="color:#00ff88;">Connecting...</span></p>

    <!-- 8 Seats Grid for Speakers -->
    <div class="grid">
        <div class="seat active">👑 Host</div>
        <div class="seat">Seat 2</div>
        <div class="seat">Seat 3</div>
        <div class="seat">Seat 4</div>
        <div class="seat">Seat 5</div>
        <div class="seat">Seat 6</div>
        <div class="seat">Seat 7</div>
        <div class="seat">Seat 8</div>
    </div>

    <div class="controls">
        <button class="btn-mic" onclick="toggleMic()">🎙️ Mic ON</button>
        <button class="btn-leave" onclick="location.reload()">🚪 Leave</button>
    </div>

    <script>
        const socket = io();
        let localStream;
        let micOn = true;

        // माइक्रोफोन एक्सेस चालू करना
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localStream = stream;
                document.getElementById('status').innerText = 'Connected & Live 🎙️';
            })
            .catch(err => {
                document.getElementById('status').innerText = 'Mic Access Denied ❌';
                document.getElementById('status').style.color = '#ff4d4d';
            });

        function toggleMic() {
            if (!localStream) return;
            micOn = !micOn;
            localStream.getAudioTracks()[0].enabled = micOn;
            const btn = document.querySelector('.btn-mic');
            btn.innerText = micOn ? '🎙️ Mic ON' : '🎙️ Mic OFF';
            btn.style.background = micOn ? '#00ff88' : '#e2e8f0';
        }
    </script>
</body>
</html>
