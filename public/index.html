<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Party Room</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg-grad);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .coins { color: #ffd700; font-weight: bold; font-size: 14px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        .theme-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .theme-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 15px auto; }

        .seat {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            width: 72px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            margin: auto;
            cursor: pointer;
            color: #ddd;
            transition: all 0.3s ease;
            position: relative;
        }

        .chair-icon { font-size: 24px; margin-bottom: 2px; }

        .seat-label {
            font-size: 10px; color: #aaa;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 60px;
        }

        .seat.taken {
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        .seat.locked {
            border: 2px solid #ff4d4d;
            background: rgba(255, 77, 77, 0.15);
            color: #ff4d4d;
        }

        .chat-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            height: 150px;
            margin: 12px auto;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            font-size: 13px;
        }

        .chat-msg { margin-bottom: 6px; word-wrap: break-word; }
        .input-area { display: flex; gap: 8px; }

        input {
            flex: 1; padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; border-radius: 10px; outline: none;
        }

        button { padding: 10px 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-send { background: linear-gradient(45deg, #ffd700, #ffa500); color: #000; }
        .btn-gift { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: #fff; }
        .btn-mic { background: linear-gradient(45deg, #11998e, #38ef7d); color: #fff; width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; font-size: 14px; }

        .admin-controls {
            display: flex; gap: 6px; margin-top: 10px;
            background: rgba(218, 54, 51, 0.15); padding: 8px; border-radius: 10px; border: 1px solid rgba(218, 54, 51, 0.3);
        }
        .admin-btn { background: #da3633; color: #fff; font-size: 10px; flex: 1; }

        /* Gift Overlay Animation */
        #giftAnim {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; display: none; z-index: 99;
            animation: giftPop 1.5s ease-out;
        }

        @keyframes giftPop {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="giftAnim">🌹</div>

        <div class="theme-selector">
            <div class="theme-btn" style="background: linear-gradient(135deg, #0f0c29, #24243e);" onclick="setTheme(1)"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #0575E6, #00F666);" onclick="setTheme(2)"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #3A1C71, #D76D77, #FFAF7B);" onclick="setTheme(3)"></div>
            <div class="theme-btn" style="background: linear-gradient(135deg, #141E30, #243B55);" onclick="setTheme(4)"></div>
        </div>

        <div class="header">
            <div style="text-align: left;">
                <span style="font-weight:bold; color:#ffd700; font-size: 16px;">👑 7 Star Party</span><br>
                <span style="font-size:11px; color:#aaa;" id="userDisplay" onclick="changeName()" title="Click to change name">User: Loading... ✏️</span>
            </div>
            <span class="coins">💰 <span id="coinCount">1000</span></span>
        </div>

        <!-- 8 Seats -->
        <div class="grid" id="seatGrid">
            <div class="seat" onclick="handleSeatClick(1)" id="seat1"><div class="chair-icon">🪑</div><span class="seat-label" id="s1">Seat 1</span></div>
            <div class="seat" onclick="handleSeatClick(2)" id="seat2"><div class="chair-icon">🪑</div><span class="seat-label" id="s2">Seat 2</span></div>
            <div class="seat" onclick="handleSeatClick(3)" id="seat3"><div class="chair-icon">🪑</div><span class="seat-label" id="s3">Seat 3</span></div>
            <div class="seat" onclick="handleSeatClick(4)" id="seat4"><div class="chair-icon">🪑</div><span class="seat-label" id="s4">Seat 4</span></div>
            <div class="seat" onclick="handleSeatClick(5)" id="seat5"><div class="chair-icon">🪑</div><span class="seat-label" id="s5">Seat 5</span></div>
            <div class="seat" onclick="handleSeatClick(6)" id="seat6"><div class="chair-icon">🪑</div><span class="seat-label" id="s6">Seat 6</span></div>
            <div class="seat" onclick="handleSeatClick(7)" id="seat7"><div class="chair-icon">🪑</div><span class="seat-label" id="s7">Seat 7</span></div>
            <div class="seat" onclick="handleSeatClick(8)" id="seat8"><div class="chair-icon">🪑</div><span class="seat-label" id="s8">Seat 8</span></div>
        </div>

        <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎙️ Connect Voice</button>

        <!-- Admin Quick Bar -->
        <div class="admin-controls">
            <button class="admin-btn" onclick="adminLockSeat()">🔒 Lock Seat 8</button>
            <button class="admin-btn" onclick="adminClearAll()">🧹 Clear All Seats</button>
        </div>

        <!-- Chat -->
        <div class="chat-box" id="chatBox">
            <div class="chat-msg" style="color: #ffd700;"><b>System:</b> 🎙️ WebRTC Engine & Custom Profiles Active!</div>
        </div>

        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Type message...">
            <button class="btn-send" onclick="sendMsg()">Send</button>
            <button class="btn-gift" onclick="sendGift()">🎁 Rose</button>
        </div>
    </div>

    <script>
        const socket = io();
        let peer = null;
        let mySeat = null;
        let localStream = null;
        let micOn = false;
        let coins = 1000;
        let userName = 'Guest_' + Math.floor(100 + Math.random() * 900);

        document.getElementById('userDisplay').innerText = userName + ' ✏️';

        function changeName() {
            const input = prompt('अपना नाम दर्ज करें:', userName);
            if(input && input.trim()) {
                userName = input.trim();
                document.getElementById('userDisplay').innerText = userName + ' ✏️';
            }
        }

        function setTheme(option) {
            if(option === 1) document.body.style.background = "linear-gradient(135deg, #0f0c29, #302b63, #24243e)";
            if(option === 2) document.body.style.background = "linear-gradient(135deg, #0575E6, #00F666)";
            if(option === 3) document.body.style.background = "linear-gradient(135deg, #3A1C71, #D76D77, #FFAF7B)";
            if(option === 4) document.body.style.background = "linear-gradient(135deg, #141E30, #243B55)";
        }

        function toggleMic() {
            if(!localStream) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    localStream = stream;
                    micOn = true;
                    document.getElementById('micBtn').style.background = 'linear-gradient(45deg, #11998e, #38ef7d)';
                    document.getElementById('micBtn').innerText = '🎙️ Mic ON';
                    initPeer();
                }).catch(() => addChat('System', '⚠️ Microphone access blocked.'));
            } else {
                micOn = !micOn;
                localStream.getAudioTracks()[0].enabled = micOn;
                document.getElementById('micBtn').style.background = micOn ? 'linear-gradient(45deg, #11998e, #38ef7d)' : 'linear-gradient(45deg, #cb2d3e, #ef473a)';
                document.getElementById('micBtn').innerText = micOn ? '🎙️ Mic ON' : '🎙️ Mic OFF';
            }
        }

        function initPeer() {
            peer = new Peer();
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', userStream => playAudio(userStream));
            });
        }

        function playAudio(stream) {
            const audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.autoplay = true;
            document.body.appendChild(audio);
        }

        function handleSeatClick(num) {
            const seatEl = document.getElementById('seat' + num);
            if(seatEl.classList.contains('locked')) return alert('This seat is locked by Admin!');
            if(mySeat === num) {
                mySeat = null;
                socket.emit('seat-leave', { seat: num, user: userName });
                return;
            }
            if(!mySeat) {
                mySeat = num;
                socket.emit('seat-take', { seat: num, user: userName });
            }
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            socket.emit('chat-msg', { user: userName, text: input.value });
            addChat('You', input.value);
            input.value = '';
        }

        function sendGift() {
            if(coins < 50) return alert('Not enough coins!');
            coins -= 50;
            document.getElementById('coinCount').innerText = coins;
            socket.emit('send-gift', { user: userName, gift: '🌹' });
            showGiftAnim('🌹');
            addChat('Gift', '🎁 You sent a Rose!');
        }

        function showGiftAnim(emoji) {
            const el = document.getElementById('giftAnim');
            el.innerText = emoji;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 1500);
        }

        function adminLockSeat() {
            socket.emit('admin-lock', { seat: 8 });
        }

        function adminClearAll() {
            socket.emit('admin-clear');
        }

        function addChat(sender, text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b>${sender}:</b> ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat-msg', (data) => addChat(data.user, data.text));
        socket.on('send-gift', (data) => {
            showGiftAnim(data.gift);
            addChat('Gift', `🎁 ${data.user} sent a Rose!`);
        });

        socket.on('seat-update', (data) => {
            const seatEl = document.getElementById('seat' + data.seat);
            const labelEl = document.getElementById('s' + data.seat);
            if(seatEl) {
                seatEl.classList.add('taken');
                seatEl.querySelector('.chair-icon').innerText = '👑';
                labelEl.innerText = data.user;
            }
        });

        socket.on('seat-remove', (data) => {
            const seatEl = document.getElementById('seat' + data.seat);
            const labelEl = document.getElementById('s' + data.seat);
            if(seatEl) {
                seatEl.classList.remove('taken');
                seatEl.querySelector('.chair-icon').innerText = '🪑';
                labelEl.innerText = 'Seat ' + data.seat;
            }
        });

        socket.on('admin-lock-seat', (data) => {
            const seatEl = document.getElementById('seat' + data.seat);
            if(seatEl) {
                seatEl.classList.add('locked');
                seatEl.querySelector('.chair-icon').innerText = '🔒';
            }
        });

        socket.on('admin-clear-seats', () => {
            for(let i=1; i<=8; i++) {
                const seatEl = document.getElementById('seat' + i);
                const labelEl = document.getElementById('s' + i);
                seatEl.className = 'seat';
                seatEl.querySelector('.chair-icon').innerText = '🪑';
                labelEl.innerText = 'Seat ' + i;
            }
            mySeat = null;
        });
    </script>
</body>
</html>
