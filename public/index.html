<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Party Room - CEO Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg-grad);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .coins { color: #ffd700; font-weight: bold; font-size: 14px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 15px auto; }

        .seat {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            width: 75px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            margin: auto;
            cursor: pointer;
            color: #ddd;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Frames */
        .seat.frame-gold { border: 3px solid #ffd700; box-shadow: 0 0 15px #ffd700; }
        .seat.frame-neon { border: 3px solid #00ffff; box-shadow: 0 0 15px #00ffff; }
        .seat.frame-fire { border: 3px solid #ff4500; box-shadow: 0 0 15px #ff4500; }
        .seat.frame-diamond { border: 3px solid #e0ffff; box-shadow: 0 0 18px #e0ffff; }

        .chair-icon { font-size: 22px; margin-bottom: 2px; }

        .medal-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 14px;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
        }

        .seat-label {
            font-size: 10px; color: #aaa;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 65px;
        }

        .seat.taken {
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }

        .chat-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            height: 130px;
            margin: 12px auto;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            font-size: 13px;
        }

        .chat-msg { margin-bottom: 6px; word-wrap: break-word; }
        .input-area { display: flex; gap: 8px; }

        input, select {
            padding: 9px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #fff; border-radius: 8px; outline: none; font-size: 11px;
        }

        button { padding: 10px 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-send { background: linear-gradient(45deg, #ffd700, #ffa500); color: #000; }
        .btn-gift { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: #fff; }
        .btn-mic { background: linear-gradient(45deg, #11998e, #38ef7d); color: #fff; width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; }

        /* CEO Dashboard Master Control */
        .ceo-panel {
            background: rgba(15, 12, 41, 0.9);
            border: 2px solid #ffd700;
            border-radius: 14px;
            padding: 12px;
            margin-top: 15px;
            text-align: left;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .ceo-title { font-size: 13px; font-weight: bold; color: #ffd700; margin-bottom: 10px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .ceo-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .btn-ceo { background: linear-gradient(45deg, #ffd700, #ff8c00); color: #000; font-size: 11px; flex: 1; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div style="text-align: left;">
                <span style="font-weight:bold; color:#ffd700; font-size: 16px;">👑 CEO Master Control</span><br>
                <span style="font-size:11px; color:#00ffff;" id="userDisplay">CEO Admin</span>
            </div>
            <span class="coins">💰 <span id="coinCount">50000</span></span>
        </div>

        <!-- 8 Seats Grid -->
        <div class="grid" id="seatGrid">
            <div class="seat" onclick="handleSeatClick(1)" id="seat1"><span class="medal-badge" id="m1"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s1">Seat 1</span></div>
            <div class="seat" onclick="handleSeatClick(2)" id="seat2"><span class="medal-badge" id="m2"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s2">Seat 2</span></div>
            <div class="seat" onclick="handleSeatClick(3)" id="seat3"><span class="medal-badge" id="m3"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s3">Seat 3</span></div>
            <div class="seat" onclick="handleSeatClick(4)" id="seat4"><span class="medal-badge" id="m4"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s4">Seat 4</span></div>
            <div class="seat" onclick="handleSeatClick(5)" id="seat5"><span class="medal-badge" id="m5"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s5">Seat 5</span></div>
            <div class="seat" onclick="handleSeatClick(6)" id="seat6"><span class="medal-badge" id="m6"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s6">Seat 6</span></div>
            <div class="seat" onclick="handleSeatClick(7)" id="seat7"><span class="medal-badge" id="m7"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s7">Seat 7</span></div>
            <div class="seat" onclick="handleSeatClick(8)" id="seat8"><span class="medal-badge" id="m8"></span><div class="chair-icon">🪑</div><span class="seat-label" id="s8">Seat 8</span></div>
        </div>

        <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎙️ Connect Voice</button>

        <!-- CEO Master Control Panel -->
        <div class="ceo-panel">
            <span class="ceo-title">💼 CEO Control Center (Tags, Medals & Coins)</span>
            
            <div class="ceo-row">
                <select id="targetSeat" style="flex: 1;">
                    <option value="1">Seat 1</option>
                    <option value="2">Seat 2</option>
                    <option value="3">Seat 3</option>
                    <option value="4">Seat 4</option>
                    <option value="5">Seat 5</option>
                    <option value="6">Seat 6</option>
                    <option value="7">Seat 7</option>
                    <option value="8">Seat 8</option>
                </select>

                <select id="roleSelect" style="flex: 1.3;">
                    <option value="User">👤 Regular User</option>
                    <option value="Admin">🛡️ Admin</option>
                    <option value="Super Admin">⚡ Super Admin</option>
                    <option value="Coin Seller">💰 Coin Seller</option>
                    <option value="Coins Merchant">🏪 Coins Merchant</option>
                </select>
            </div>

            <div class="ceo-row">
                <select id="frameSelect" style="flex: 1;">
                    <option value="none">No Frame</option>
                    <option value="frame-gold">👑 Royal Gold</option>
                    <option value="frame-neon">⚡ Neon Glow</option>
                    <option value="frame-fire">🔥 Fire Aura</option>
                    <option value="frame-diamond">💎 Diamond Ice</option>
                </select>

                <select id="medalSelect" style="flex: 1;">
                    <option value="none">No Medal</option>
                    <option value="🥇">🥇 Gold Crown Medal</option>
                    <option value="💎">💎 VIP Diamond Medal</option>
                    <option value="🌟">🌟 Top Host Medal</option>
                    <option value="✔️">✔️ Verified Star Badge</option>
                </select>
            </div>

            <div class="ceo-row">
                <input type="number" id="coinAddInput" placeholder="+ Add Coins" style="flex: 1;">
                <button class="btn-ceo" onclick="applyCeoSettings()">💾 Apply & Grant Permissions</button>
            </div>
        </div>

        <!-- Chat Box -->
        <div class="chat-box" id="chatBox">
            <div class="chat-msg" style="color: #ffd700;"><b>CEO System:</b> All Master Permissions Active!</div>
        </div>

        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Type message..." style="flex:1;">
            <button class="btn-send" onclick="sendMsg()">Send</button>
            <button class="btn-gift" onclick="sendGift()">🎁 Gift</button>
        </div>
    </div>

    <script>
        const socket = io();
        let mySeat = null;
        let localStream = null;
        let micOn = false;
        let coins = 50000;
        let userName = 'CEO_Master';

        document.getElementById('userDisplay').innerText = userName;

        function toggleMic() {
            if(!localStream) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    localStream = stream;
                    micOn = true;
                    document.getElementById('micBtn').innerText = '🎙️ Mic ON';
                }).catch(() => alert('Mic blocked'));
            } else {
                micOn = !micOn;
                localStream.getAudioTracks()[0].enabled = micOn;
                document.getElementById('micBtn').innerText = micOn ? '🎙️ Mic ON' : '🎙️ Mic OFF';
            }
        }

        function handleSeatClick(num) {
            if(mySeat === num) {
                mySeat = null;
                socket.emit('seat-leave', { seat: num, user: userName });
                return;
            }
            if(!mySeat) {
                mySeat = num;
                socket.emit('seat-take', { seat: num, user: userName, role: 'CEO' });
            }
        }

        function applyCeoSettings() {
            const seat = document.getElementById('targetSeat').value;
            const role = document.getElementById('roleSelect').value;
            const frame = document.getElementById('frameSelect').value;
            const medal = document.getElementById('medalSelect').value;
            const addCoins = parseInt(document.getElementById('coinAddInput').value) || 0;

            socket.emit('ceo-apply-perm', {
                seat: seat,
                role: role,
                frame: frame,
                medal: medal,
                addCoins: addCoins
            });

            addChat('CEO Admin', `✅ Configured Seat ${seat} -> [${role}] Frame: ${frame} Medal: ${medal} Coins: +${addCoins}`);
            document.getElementById('coinAddInput').value = '';
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            socket.emit('chat-msg', { user: userName, text: input.value });
            addChat('You', input.value);
            input.value = '';
        }

        function sendGift() {
            if(coins < 50) return alert('Not enough coins!');
            coins -= 50;
            document.getElementById('coinCount').innerText = coins;
            socket.emit('chat-msg', { user: userName, text: '🎁 Sent a Royal Gift!' });
            addChat('Gift', '🎁 You sent a Royal Gift!');
        }

        function addChat(sender, text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b>${sender}:</b> ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat-msg', (data) => addChat(data.user, data.text));

        socket.on('seat-update', (data) => {
            const seatEl = document.getElementById('seat' + data.seat);
            const labelEl = document.getElementById('s' + data.seat);
            if(seatEl) {
                seatEl.classList.add('taken');
                let icon = '👑';
                if(data.role === 'Coin Seller') icon = '💰';
                if(data.role === 'Coins Merchant') icon = '🏪';
                if(data.role === 'Super Admin') icon = '⚡';
                seatEl.querySelector('.chair-icon').innerText = icon;
                labelEl.innerText = data.user;
            }
        });

        socket.on('seat-remove', (data) => {
            const seatEl = document.getElementById('seat' + data.seat);
            const labelEl = document.getElementById('s' + data.seat);
            const medalEl = document.getElementById('m' + data.seat);
            if(seatEl) {
                seatEl.className = 'seat';
                seatEl.querySelector('.chair-icon').innerText = '🪑';
                labelEl.innerText = 'Seat ' + data.seat;
                if(medalEl) medalEl.innerText = '';
            }
        });

        socket.on('ceo-perm-applied', (data) => {
            const seatEl = document.getElementById('seat' + data.seat);
            const medalEl = document.getElementById('m' + data.seat);
            if(seatEl) {
                seatEl.classList.remove('frame-gold', 'frame-neon', 'frame-fire', 'frame-diamond');
                if(data.frame !== 'none') {
                    seatEl.classList.add(data.frame);
                }
            }
            if(medalEl) {
                medalEl.innerText = data.medal !== 'none' ? data.medal : '';
            }
        });
    </script>
</body>
</html>
