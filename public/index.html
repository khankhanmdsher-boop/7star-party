<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Star Party Room</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0d0f12; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #161b22; border-radius: 8px; margin-bottom: 15px; }
        .coins { color: #ffd700; font-weight: bold; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 360px; margin: 15px auto; }
        .seat { background: #1f242d; border: 2px dashed #30363d; border-radius: 50%; width: 68px; height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; margin: auto; cursor: pointer; color: #8b949e; position: relative; }
        .seat.taken { border: 2px solid #00ff88; background: #0e2a1f; color: #00ff88; font-weight: bold; box-shadow: 0 0 8px #00ff88; }
        .chat-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; height: 160px; max-width: 360px; margin: 15px auto; overflow-y: auto; text-align: left; padding: 10px; font-size: 13px; }
        .chat-msg { margin-bottom: 6px; word-wrap: break-word; }
        .input-area { display: flex; gap: 8px; max-width: 360px; margin: auto; }
        input { flex: 1; padding: 10px; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 6px; outline: none; }
        button { padding: 10px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-send { background: #ffd700; color: #000; }
        .btn-gift { background: #ff4d4d; color: #fff; }
        .btn-mic { background: #238636; color: #fff; width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; }
        .admin-panel { background: #161b22; border: 1px solid #da3633; border-radius: 8px; padding: 10px; max-width: 360px; margin: 15px auto; display: flex; gap: 5px; }
        .admin-btn { background: #da3633; color: #fff; font-size: 11px; flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <span style="font-weight:bold; color:#ffd700;">👑 7 Star Party</span><br>
            <span style="font-size:11px; color:#8b949e;" id="userDisplay">ID: Loading...</span>
        </div>
        <span class="coins">💰 <span id="coinCount">1000</span></span>
    </div>

    <!-- 8 Voice Seats -->
    <div class="grid" id="seatGrid">
        <div class="seat" onclick="handleSeatClick(1)"><span id="s1">Mic 1</span></div>
        <div class="seat" onclick="handleSeatClick(2)"><span id="s2">Mic 2</span></div>
        <div class="seat" onclick="handleSeatClick(3)"><span id="s3">Mic 3</span></div>
        <div class="seat" onclick="handleSeatClick(4)"><span id="s4">Mic 4</span></div>
        <div class="seat" onclick="handleSeatClick(5)"><span id="s5">Mic 5</span></div>
        <div class="seat" onclick="handleSeatClick(6)"><span id="s6">Mic 6</span></div>
        <div class="seat" onclick="handleSeatClick(7)"><span id="s7">Mic 7</span></div>
        <div class="seat" onclick="handleSeatClick(8)"><span id="s8">Mic 8</span></div>
    </div>

    <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎙️ Enable Microphone</button>

    <!-- Admin Quick Controls -->
    <div class="admin-panel">
        <button class="admin-btn" onclick="adminAction('mute')">🔇 Mute All</button>
        <button class="admin-btn" onclick="adminAction('clear')">🧹 Clear Seats</button>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
        <div class="chat-msg" style="color: #ffd700;"><b>System:</b> Voice, Profile & Admin Engine Online!</div>
    </div>

    <!-- Inputs -->
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type message...">
        <button class="btn-send" onclick="sendMsg()">Send</button>
        <button class="btn-gift" onclick="sendGift()">🎁 Gift</button>
    </div>

    <div id="audioContainer"></div>

    <script>
        const socket = io();
        let mySeat = null;
        let localStream = null;
        let micOn = false;
        let coins = 1000;
        let userId = 'User_' + Math.floor(1000 + Math.random() * 9000);
        let peers = {};

        document.getElementById('userDisplay').innerText = 'ID: ' + userId;

        function toggleMic() {
            if(!localStream) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    localStream = stream;
                    micOn = true;
                    document.getElementById('micBtn').style.background = '#238636';
                    document.getElementById('micBtn').innerText = '🎙️ Mic ON';
                    socket.emit('voice-ready', userId);
                }).catch(() => {
                    addChat('System', '⚠️ Mic permission blocked in browser settings.');
                });
            } else {
                micOn = !micOn;
                localStream.getAudioTracks()[0].enabled = micOn;
                document.getElementById('micBtn').style.background = micOn ? '#238636' : '#da3633';
                document.getElementById('micBtn').innerText = micOn ? '🎙️ Mic ON' : '🎙️ Mic OFF';
            }
        }

        function handleSeatClick(num) {
            if(mySeat === num) {
                mySeat = null;
                socket.emit('seat-leave', { seat: num, user: userId });
                return;
            }
            if(!mySeat) {
                mySeat = num;
                socket.emit('seat-take', { seat: num, user: userId });
            }
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            socket.emit('chat-msg', { user: userId, text: input.value });
            addChat('You', input.value);
            input.value = '';
        }

        function sendGift() {
            if(coins < 50) return alert('Not enough coins!');
            coins -= 50;
            document.getElementById('coinCount').innerText = coins;
            socket.emit('chat-msg', { user: userId, text: '🎁 Sent a Rose Gift (50 Coins)!' });
            addChat('Gift', '🎁 You sent a Rose Gift!');
        }

        function adminAction(action) {
            socket.emit('admin-action', { action, by: userId });
        }

        function addChat(sender, text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<b>${sender}:</b> ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        socket.on('chat-msg', (data) => addChat(data.user, data.text));
        
        socket.on('seat-update', (data) => {
            const el = document.getElementById('s' + data.seat);
            if(el) {
                el.parentElement.classList.add('taken');
                el.innerText = data.user;
            }
        });

        socket.on('seat-remove', (data) => {
            const el = document.getElementById('s' + data.seat);
            if(el) {
                el.parentElement.classList.remove('taken');
                el.innerText = 'Mic ' + data.seat;
            }
        });

        socket.on('admin-action-received', (data) => {
            if(data.action === 'clear') {
                for(let i=1; i<=8; i++) {
                    const el = document.getElementById('s' + i);
                    el.parentElement.classList.remove('taken');
                    el.innerText = 'Mic ' + i;
                }
                mySeat = null;
                addChat('Admin', 'All seats cleared by admin.');
            } else if(data.action === 'mute') {
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    micOn = false;
                    document.getElementById('micBtn').style.background = '#da3633';
                    document.getElementById('micBtn').innerText = '🎙️ Mic OFF';
                }
                addChat('Admin', 'All microphones muted by admin.');
            }
        });
    </script>
</body>
</html>
